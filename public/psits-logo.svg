<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer fill -->
  <circle cx="100" cy="100" r="96" fill="#0066FF" />
  <!-- Gold ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#F5B800" stroke-width="3" />
  <!-- Dark inner -->
  <circle cx="100" cy="100" r="78" fill="#0F172A" />
  <!-- Code bracket accent -->
  <text x="22" y="118" font-family="monospace" font-size="28" font-weight="700" fill="#F5B800" opacity="0.6">&lt;/&gt;</text>
  <!-- PSITS wordmark -->
  <text x="100" y="93" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">PSITS</text>
  <!-- Divider -->
  <line x1="58" y1="103" x2="142" y2="103" stroke="#0066FF" stroke-width="1.5" opacity="0.6" />
  <!-- CTU Main label -->
  <text x="100" y="120" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#F5B800" text-anchor="middle" letter-spacing="3">CTU MAIN</text>
</svg>
